<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>polarBEAVER.TV cast receiver</title>
<meta name="referrer" content="no-referrer">
<style>
  html,body{margin:0;background:#000;height:100%;overflow:hidden}
  #board,#play-page{border:0;width:100%;height:100%;display:block;background:#000}
  #play-page{position:fixed;inset:0;z-index:4;display:none}
  #play-page.on{display:block}
  #player-wrap{position:fixed;inset:0;z-index:6;opacity:0;pointer-events:none;background:#000}
  #player-wrap.on{opacity:1;pointer-events:auto}
  #player-wrap cast-media-player{width:100%;height:100%;--splash-image:none;--logo-image:none}
  /* goal card (bottom-left, like the app's goal alert) + muted clip picture-in-picture (bottom-right) */
  #goal-card{position:fixed;left:3.2vw;bottom:5vh;z-index:20;display:flex;align-items:center;gap:clamp(10px,1.2vw,18px);min-width:min(430px,86vw);max-width:min(44vw,720px);padding:clamp(10px,1.2vw,16px) clamp(12px,1.4vw,22px) clamp(10px,1.2vw,16px) clamp(10px,1vw,16px);box-sizing:border-box;
    border:1px solid #3f3f46;border-left:6px solid var(--team,#ca8a04);border-radius:18px;background:rgba(0,0,0,.82);box-shadow:0 18px 50px rgba(0,0,0,.6);
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#fff;opacity:0;transform:translateY(24px);transition:opacity .35s,transform .35s;pointer-events:none}
  #goal-card.on{opacity:1;transform:none}
  #goal-card .gc-pics{position:relative;flex:none;width:clamp(48px,3.75vw,96px);height:clamp(48px,3.75vw,96px)}
  #goal-card .gc-mug{width:100%;height:100%;border-radius:50%;background:#18181b;border:2px solid var(--team,#3f3f46);object-fit:cover;object-position:center top}
  #goal-card .gc-logo{position:absolute;right:-12px;bottom:-8px;width:38%;height:38%;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.8))}
  #goal-card .gc-logo:only-child{position:static;width:100%;height:100%}
  #goal-card .gc-text{min-width:0;flex:1}
  #goal-card .gc-title,#goal-card .gc-scorer,#goal-card .gc-assists,#goal-card .gc-milestones{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  #goal-card .gc-title{font-size:clamp(16px,1.15vw,28px);font-weight:900;letter-spacing:.02em;text-transform:uppercase;color:var(--team,#fff);text-shadow:0 1px 0 #000}
  #goal-card .gc-scorer{font-size:clamp(14px,1.05vw,24px);font-weight:800;margin-top:2px}
  #goal-card .gc-assists{font-size:clamp(11px,.8vw,16px);color:#d4d4d8;margin-top:3px;font-family:ui-monospace,Menlo,monospace}
  #goal-card .gc-milestones{font-size:clamp(11px,.8vw,16px);font-weight:900;color:#facc15;margin-top:3px;text-transform:uppercase;letter-spacing:.02em}
  #goal-card .gc-meta{display:flex;gap:14px;margin-top:6px;font-size:clamp(11px,.75vw,16px);font-family:ui-monospace,Menlo,monospace;color:#a1a1aa;white-space:nowrap}
  #goal-card .gc-score{color:#fff;font-weight:700}
  #goal-pip{position:fixed;right:3.2vw;bottom:5vh;z-index:20;width:28vw;max-width:640px;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;
    border:2px solid rgba(255,255,255,.85);box-shadow:0 18px 50px rgba(0,0,0,.65);opacity:0;transform:translateY(24px);transition:opacity .35s,transform .35s;pointer-events:none}
  #goal-pip[data-corner="bl"]{left:3.2vw;right:auto;bottom:5vh;top:auto}
  #goal-pip[data-corner="tr"]{right:3.2vw;left:auto;top:5vh;bottom:auto}
  #goal-pip[data-corner="tl"]{left:3.2vw;right:auto;top:5vh;bottom:auto}
  #goal-pip[data-size="s"]{width:18vw}
  #goal-pip[data-size="l"]{width:38vw}
  #goal-pip.pip-off{display:none}
  #goal-pip.on{opacity:1;transform:none}
  #goal-pip video{width:100%;height:100%;object-fit:contain;background:#000;display:block}

  #notice{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:#000;color:#fff;
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;text-align:center;padding:6vh 8vw;box-sizing:border-box}
  #notice.on{display:flex}
  #notice .box{max-width:70vw;border:1px solid #3f3f46;border-radius:18px;background:#000;padding:4vh 4vw}
  #notice h1{margin:0 0 2vh;font-size:clamp(20px,2.4vw,48px);font-weight:900}
  #notice p{margin:0;font-size:clamp(14px,1.4vw,28px);color:#d4d4d8;line-height:1.4}
</style>
  <script type="module" crossorigin src="../assets/receiver-CfF8YaEZ.js"></script>
  <link rel="modulepreload" crossorigin href="../assets/relay-WL4cD09O.js">
</head><body>
<iframe id="board" allow="autoplay; fullscreen"></iframe>
<iframe id="play-page" allow="autoplay; fullscreen"></iframe>
<div id="player-wrap"><cast-media-player></cast-media-player></div>
<div id="notice"><div class="box"><h1 id="notice-title"></h1><p id="notice-text"></p></div></div>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</body></html>
